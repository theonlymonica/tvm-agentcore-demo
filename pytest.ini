[pytest]
# Test harness (Python 3.14).
#
# Tests live in the top-level tests/ directory because the code under test
# spans multiple source roots (tools/, interceptor/, shared/, cdk/). Import
# paths are configured in the root conftest.py.
#
# Dependencies (pytest, hypothesis, moto, boto3) are declared in
# requirements-dev.txt; install them into a Python 3.14 venv before running.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# prepend import mode keeps sys.path handling predictable alongside the
# explicit path setup performed in the root conftest.py.
addopts =
    -ra
    --strict-markers
    --import-mode=prepend

markers =
    property: property-based (Hypothesis) tests validating the design's correctness properties.
    integration: tests that exercise multiple components together (still offline via moto/stubs).
